[workspace]
resolver = "2"
members = [
    "crates/omnimix-core",
    "crates/omnimix-windows",
    "crates/omnimix-macos",
    "crates/omnimix-probe",
    "crates/omnimix-ffi",
    "app/src-tauri",
]

[workspace.package]
version = "0.1.1"
edition = "2021"
authors = ["Aristotle"]
rust-version = "1.80"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
opt-level = 3
lto = "thin"
strip = true
