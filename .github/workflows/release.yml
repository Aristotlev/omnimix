# Builds signed Windows + macOS installers for every version tag (v*) and
# publishes them with latest.json. Installed OmniMix apps read latest.json on
# launch and offer the update.
name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows-latest
            args: ""
            targets: ""
          - platform: macos-latest
            args: "--target universal-apple-darwin --bundles app,dmg"
            targets: "aarch64-apple-darwin,x86_64-apple-darwin"
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.targets }}

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: ". -> target"

      - name: Install frontend dependencies
        run: npm ci
        working-directory: app

      - name: Release notes
        id: notes
        shell: bash
        run: |
          {
            echo 'body<<NOTES_EOF'
            if [ -f RELEASE_NOTES.md ]; then cat RELEASE_NOTES.md; else echo 'Bug fixes and improvements.'; fi
            echo
            echo 'NOTES_EOF'
          } >> "$GITHUB_OUTPUT"

      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          MACOSX_DEPLOYMENT_TARGET: "14.4"
        with:
          projectPath: app
          tagName: v__VERSION__
          releaseName: OmniMix v__VERSION__
          releaseBody: ${{ steps.notes.outputs.body }}
          releaseDraft: false
          prerelease: false
          includeUpdaterJson: true
          args: ${{ matrix.args }}

      # Same file under a name that never changes, so the download buttons always get the latest version.
      - name: Attach fixed-name download
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [ "$RUNNER_OS" = "Windows" ]; then
            SRC=$(ls target/release/bundle/nsis/*-setup.exe | head -n1)
            NAME=OmniMix-Windows.exe
          else
            SRC=$(ls target/universal-apple-darwin/release/bundle/dmg/*.dmg | head -n1)
            NAME=OmniMix-Mac.dmg
          fi
          cp "$SRC" "$NAME"
          gh release upload "$GITHUB_REF_NAME" "$NAME" --clobber -R "${{ github.repository }}"

      # Download links and first-launch steps on the release page only. The in-app update
      # banner reads its text from latest.json, which keeps just RELEASE_NOTES.md.
      - name: Add download links to the release page
        if: runner.os == 'Windows'
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          BODY=$(gh release view "$GITHUB_REF_NAME" -R "${{ github.repository }}" --json body --jq .body)
          case "$BODY" in *OmniMix-Windows.exe*) exit 0 ;; esac
          {
            echo '**Download:** [Windows](https://github.com/Aristotlev/omnimix/releases/latest/download/OmniMix-Windows.exe) · [Mac](https://github.com/Aristotlev/omnimix/releases/latest/download/OmniMix-Mac.dmg)'
            echo
            echo "$BODY"
            echo
            echo 'Windows 10/11: run OmniMix-Windows.exe. If you see "Windows protected your PC", click More info, then Run anyway.'
            echo "Mac (macOS 14.4+, Apple silicon and Intel): open OmniMix-Mac.dmg and drag OmniMix to Applications. If macOS can't verify the developer, open System Settings → Privacy & Security and click Open Anyway."
            echo
            echo 'Already installed? OmniMix updates itself.'
          } > release-page.md
          gh release edit "$GITHUB_REF_NAME" -R "${{ github.repository }}" --notes-file release-page.md
